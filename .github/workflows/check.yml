name: Check stock

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Check stock
        env:
          NOTIFICATION_WEBHOOK_URLS: ${{ secrets.NOTIFICATION_WEBHOOK_URLS || vars.NOTIFICATION_WEBHOOK_URLS }}
          NOTIFICATION_WEBHOOK_TIMEOUT: ${{ vars.NOTIFICATION_WEBHOOK_TIMEOUT || '15' }}
          NOTIFICATION_DEBUG: ${{ vars.NOTIFICATION_DEBUG || 'false' }}
          STOCK_PRODUCTS: ${{ secrets.STOCK_PRODUCTS || vars.STOCK_PRODUCTS }}
          EMAIL_SUBJECT_PREFIX: ClimRadar 75018
        run: |
          if ! python check_stock.py; then
            echo "::warning::Stock check failed (see logs above); continuing without failing workflow."
          fi

      - name: Commit updated state
        run: |
          if ! git status --porcelain -- state.json | grep -q .; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git commit -m "Update stock state"; then
            echo "::warning::Unable to create commit for state.json; continuing."
            exit 0
          fi
          if ! git push; then
            echo "::warning::Unable to push updated state; continuing."
          fi
