name: Check stock

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug webhook probe
        env:
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL || vars.NOTIFICATION_WEBHOOK_URL }}
          NOTIFICATION_WEBHOOK_TIMEOUT: ${{ vars.NOTIFICATION_WEBHOOK_TIMEOUT || '15' }}
          WEBHOOK_DEBUG_PROBE: ${{ vars.WEBHOOK_DEBUG_PROBE || 'false' }}
        run: |
          if [ "$WEBHOOK_DEBUG_PROBE" != "true" ]; then
            echo "Webhook debug probe is disabled (set vars.WEBHOOK_DEBUG_PROBE=true to enable)."
            exit 0
          fi

          python - <<'PY'
          import os
          import requests

          webhook_url = os.getenv("NOTIFICATION_WEBHOOK_URL", "").strip()
          timeout = int(os.getenv("NOTIFICATION_WEBHOOK_TIMEOUT", "15"))

          if not webhook_url:
              print("::warning::NOTIFICATION_WEBHOOK_URL is empty, webhook cannot be probed.")
              raise SystemExit(0)

          payload = {
              "subject": "Stock alert webhook debug",
              "message": "[debug] GitHub Actions webhook probe",
              "text": "[debug] GitHub Actions webhook probe",
              "content": "[debug] GitHub Actions webhook probe",
          }

          try:
              response = requests.post(
                  webhook_url,
                  json=payload,
                  headers={"Content-Type": "application/json"},
                  timeout=timeout,
              )
              print(f"Webhook probe HTTP status: {response.status_code}")
              if response.text:
                  print(f"Webhook probe response preview: {response.text[:200].replace(chr(10), ' ')}")
              if response.status_code >= 400:
                  print("::warning::Webhook probe returned a non-success status code.")
          except requests.RequestException as error:
              print(f"::warning::Webhook probe failed: {error}")
          PY

      - name: Check stock
        env:
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL || vars.NOTIFICATION_WEBHOOK_URL }}
          NOTIFICATION_WEBHOOK_TIMEOUT: ${{ vars.NOTIFICATION_WEBHOOK_TIMEOUT || '15' }}
          NOTIFICATION_DEBUG: ${{ vars.NOTIFICATION_DEBUG || 'false' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
          STOCK_PRODUCTS: ${{ secrets.STOCK_PRODUCTS || vars.STOCK_PRODUCTS }}
          EMAIL_SUBJECT_PREFIX: ClimRadar 75018
        run: |
          if ! python check_stock.py; then
            echo "::warning::Stock check failed (see logs above); continuing without failing workflow."
          fi

      - name: Commit updated state
        run: |
          if ! git status --porcelain -- state.json | grep -q .; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git commit -m "Update stock state"; then
            echo "::warning::Unable to create commit for state.json; continuing."
            exit 0
          fi
          if ! git push; then
            echo "::warning::Unable to push updated state; continuing."
          fi
